# Pushing a tag like v1.0.0 builds Apoji Admin for Mac (Apple silicon + Intel) and Windows (x64 + Arm), and publishes
# one GitHub Release with the DMGs, zips and the Windows installers. The app checks this release for updates.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no Apple Developer ID yet; see the install steps in the release notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Brightness helper (real screen dimming)
        run: sh scripts/build-brightness.sh
      - name: Build
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Apoji Admin for Mac
          The admin app for Nexus '28 and N28C: dashboard, end-to-end encrypted admin chat, feedback and bug inbox, beta requests, users, moderation, feature flags, announcements, maintenance and GitHub.

          ## Install
          1. Download **Apoji-Admin-…-arm64.dmg** (Apple silicon, M1 or newer) or **…-x64.dmg** (Intel).
          2. Open it and drag **Apoji Admin** to Applications.
          3. Run once in Terminal (the app isn't notarized by Apple yet):
          ```
          xattr -cr "/Applications/Apoji Admin.app"
          codesign --force --deep --sign - "/Applications/Apoji Admin.app"
          ```
          4. Open it and sign in with your admin account.

          ## Apoji Admin for Windows
          1. Download **Apoji-Admin-…-Windows-x64.exe** (most PCs) or **…-Windows-arm64.exe** (Arm laptops like Snapdragon).
          2. Run it. Windows may show **"Windows protected your PC"** because the app isn't code-signed yet: click **More info → Run anyway**.
          3. Pick where to install, then open Apoji Admin from the Start menu or the desktop and sign in.

          Updating: download the new version, replace the app, and run the two commands again. You stay signed in; on a new Mac, unlock admin chat with the team passphrase.
          NOTES
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Apoji Admin ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 2.0.4: the Windows installers, added to the same release once it exists
  windows:
    runs-on: windows-latest
    needs: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npx electron-builder --win nsis --x64 --arm64 --publish never
      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
