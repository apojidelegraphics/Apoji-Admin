<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0817">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apoji Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Apoji Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Apoji Admin: the admin portal for Nexus '28 and N28C. Anyone can load this page, but every list and action goes through
     Supabase row-level security and admin-only functions (is_admin()), so it only works for accounts in public.admin_roles.
     Admin chat is end-to-end encrypted in the browser (crypto.js). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header>
  <img class="logo" src="icons/icon-192.png" alt="">
  <div class="ttl"><b>APOJI ADMIN <span class="ttl-portal">PORTAL</span></b><small>Nexus '28 · N28C</small></div>
  <span class="sp"></span>
  <div id="hdr" class="row" style="gap:8px"></div>
</header>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script src="admin.js"></script>
<script src="crypto.js"></script>
<script src="charts.js"></script>
<script src="chat.js"></script>
<script src="pages.js"></script>
<script src="extras.js"></script>
<script src="features.js"></script>
<script src="orb.js"></script>
<script src="v18.js"></script>
<script src="v19.js"></script>
<script src="mindtree.js"></script>
<script src="v23.js"></script>
<script src="terms-data.js"></script>
<script src="v25.js"></script>
<script>
  NX.start();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => { if (/^#[\w/-]*$/.test(e.data?.go || '')) location.hash = e.data.go; });   // tapped a phone notification
  }
</script>
</body>
</html>
