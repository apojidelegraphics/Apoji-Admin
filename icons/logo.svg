<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1236"/><stop offset=".55" stop-color="#0d0a1f"/><stop offset="1" stop-color="#05040d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5ff"/><stop offset=".5" stop-color="#8b6cff"/><stop offset="1" stop-color="#4fd8ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd8ff" stop-opacity="0"/><stop offset=".5" stop-color="#4fd8ff" stop-opacity=".9"/><stop offset="1" stop-color="#c4b5ff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="4"/>
  <!-- orbit ring -->
  <ellipse cx="512" cy="560" rx="360" ry="128" fill="none" stroke="url(#ring)" stroke-width="14" transform="rotate(-18 512 560)"/>
  <!-- the A: two legs meeting at a rounded apex -->
  <g filter="url(#soft)" opacity=".55">
    <path d="M300 780 L512 238 L724 780" fill="none" stroke="#8b6cff" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M300 780 L512 238 L724 780" fill="none" stroke="url(#mark)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crossbar is a keyhole node: control + encryption -->
  <circle cx="512" cy="590" r="66" fill="#05040d"/>
  <circle cx="512" cy="590" r="66" fill="none" stroke="url(#mark)" stroke-width="22"/>
  <circle cx="512" cy="578" r="17" fill="#e9e3ff"/>
  <path d="M503 586 L521 586 L526 622 L498 622 Z" fill="#e9e3ff"/>
  <!-- node on the orbit -->
  <circle cx="852" cy="440" r="26" fill="#4fd8ff"/>
  <circle cx="852" cy="440" r="48" fill="#4fd8ff" opacity=".18"/>
</svg>
